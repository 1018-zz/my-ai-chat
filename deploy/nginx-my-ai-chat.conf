# /etc/nginx/sites-available/xiaojia
# 安装：
#   sudo cp deploy/nginx-my-ai-chat.conf /etc/nginx/sites-available/xiaojia
#   sudo ln -s /etc/nginx/sites-available/xiaojia /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 证书（首次）：把 server_name 改成你的域名后执行
#   sudo certbot --nginx -d xiaojia.example.com
# certbot 会自动改写本配置补全 ssl_ 行并完成 80->443 跳转。

server {
    listen 80;
    server_name xiaojia.example.com;   # TODO: 改成你的域名（无域名可先保留 IP 访问，跳过证书）

    # certbot 申请证书用的挑战目录
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    # 有域名+证书后，由 certbot 接管为 301 跳转；无证书时先用下面这行临时开放 HTTP：
    # location / { proxy_pass http://127.0.0.1:3000; include proxy.inc; }
}

server {
    listen 443 ssl;
    server_name xiaojia.example.com;   # TODO: 改成你的域名

    # certbot 生成后路径形如 /etc/letsencrypt/live/xiaojia.example.com/...
    ssl_certificate     /etc/letsencrypt/live/xiaojia.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xiaojia.example.com/privkey.pem;

    # 反向代理到本地 Node 运行时（server.js 监听 127.0.0.1:3000）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 流式聊天（SSE）需关闭缓冲、保持长连接
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
